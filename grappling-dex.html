<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grappling Dex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header with views + log button; Dex grid (or pan/zoom Map) on the left, entry panel docked right (stacked on phones); session log opens as a sheet. Single dark "game board" look by choice. */
:root {
  color-scheme: dark;
  --bg: #0e1320;
  --bg-2: #141b2c;
  --panel: #182033;
  --line: #2a3552;
  --ink: #e7eaf3;
  --muted: #8d97b0;
  --brass: #d9b46c;
  --brass-soft: rgba(217, 180, 108, .16);
  --sub: #f2766d;
  --sweep: #4fcbb2;
  --pass: #6fb2ff;
  --move: #b58df2;
  --escape: #a3adc4;
  --gap: #f2766d;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg-2);
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--brass); }
.brand small { color: var(--muted); font-size: 12px; }
.progress { display: flex; align-items: center; gap: 10px; min-width: 170px; flex: 1 1 200px; max-width: 320px; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brass), #f0d79d); transition: width .4s; }
.progress span { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.primary { padding: 8px 14px; border-radius: 8px; border: 0; background: var(--brass); color: var(--bg); font: 700 13px var(--font-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.ghost { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 13px var(--font-body); cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 12px var(--font-body); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .4; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.search { flex: 0 1 220px; min-width: 140px; }
input[type="text"], input[type="search"], input[type="date"], select {
  width: 100%; box-sizing: border-box; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 13px var(--font-body);
}
.sr { position: absolute; left: -9999px; }
.views { display: flex; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.views a { padding: 5px 14px; border-radius: 6px; color: var(--muted); text-decoration: none; font: 600 13px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.views a[aria-current="page"] { background: var(--brass); color: var(--bg); }
main { flex: 1; display: flex; min-height: 0; }

/* Dex */
#dex { flex: 1; min-width: 0; overflow-y: auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
#dex h2 { font: 600 12px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 6px 0 10px; display: flex; justify-content: space-between; gap: 12px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg-2); display: flex; flex-direction: column; gap: 6px; }
.tile b { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.gaps { border: 1px solid var(--line); border-left: 3px solid var(--gap); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; background: var(--bg-2); display: flex; flex-direction: column; gap: 6px; }
.gaps strong { font: 600 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--gap); }
.gaps button { all: unset; cursor: pointer; color: var(--ink); line-height: 1.45; }
.gaps button:hover { text-decoration: underline; }
.gaps button:focus-visible { outline: 2px solid var(--brass); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 8px; margin-bottom: 22px; }
.card { display: flex; flex-direction: column; gap: 5px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); cursor: pointer; font: inherit; min-width: 0; }
.card:hover { border-color: var(--muted); }
.card .no { font: 600 11px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; align-items: center; letter-spacing: .05em; }
.card .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.card .meta { font-size: 11.5px; color: var(--muted); }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card.st0 .nm { color: var(--muted); }
.card.st0.far { opacity: .55; }
.card.st4 { border-color: var(--brass); background: linear-gradient(180deg, var(--brass-soft), var(--bg-2) 70%); }
.card.st3 { border-color: rgba(217, 180, 108, .55); }
.card.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.status { font: 600 10.5px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status.on { color: var(--brass); }
.days { display: flex; align-items: center; gap: 8px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--brass, #d9b46c); opacity: .5; }
.dots i.f { background: var(--brass, #d9b46c); opacity: 1; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 4px; border-radius: 2px; background: var(--line); }
.pips i.f { background: var(--brass); }
.entry-no { font-family: var(--font-display); color: var(--brass); font-variant-numeric: tabular-nums; }

/* Dex device */
#dex { display: flex; overflow: hidden; padding-block: 14px; }
.device { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: 18px; background: linear-gradient(160deg, #26324f, #151c2e); border: 2px solid #3a4870; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 12px 32px rgba(0, 0, 0, .45); }
.dev-top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 2px solid #0c1220; box-shadow: 0 1px 0 #3a4870; }
.led { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.dev-title { margin-left: 6px; font: 700 13px var(--font-display); letter-spacing: .22em; text-transform: uppercase; color: var(--brass); }
.dev-count { margin-left: auto; font: 600 12px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .05em; }
.dev-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; padding: 14px; }
.screen {
  --screen: #0c1a21; min-height: 0; overflow-y: auto; border-radius: 10px; border: 3px solid #080c16;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px), var(--screen);
  box-shadow: inset 0 0 0 1px #3a4870, inset 0 0 28px rgba(0, 0, 0, .55);
}
.viewer aside h2 { display: block; margin: 0; font: 600 24px var(--font-display); letter-spacing: .01em; text-transform: none; color: var(--ink); }
.viewer aside { width: auto; border: 0; background: transparent; max-height: none; padding: 16px; overflow: visible; }
.listhead { position: sticky; top: 0; z-index: 1; background: var(--screen); padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #1c3039; }
.mini { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.mini b { color: var(--ink); font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.ltabs { display: flex; gap: 4px; }
.ltabs button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #23404a; background: transparent; color: var(--muted); font: 600 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.ltabs button[aria-pressed="true"] { background: #15303a; color: var(--ink); border-color: var(--sweep); }
.dexlist { list-style: none; margin: 0; padding: 6px; }
.row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 44px 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 6px; cursor: pointer; font: 500 13.5px var(--font-display); color: var(--ink); }
.row:hover { background: rgba(255, 255, 255, .05); }
.row:focus-visible { outline: 2px solid var(--brass); }
.row .no { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.st0 .nm { color: var(--muted); }
.row.far { opacity: .45; }
.row.sel { background: var(--brass); color: var(--bg); }
.row.sel .no, .row.sel .nm { color: var(--bg); }
.row.sel .pips i { background: rgba(14, 19, 32, .25); }
.row.sel .pips i.f { background: var(--bg); }
.row .ic svg { display: block; }
.dev-controls { display: flex; gap: 8px; align-items: center; padding: 0 16px 14px; }
.padbtn { width: 40px; height: 30px; border-radius: 8px; background: #0f1626; border: 1px solid #3a4870; color: var(--ink); cursor: pointer; font-size: 12px; }
.padbtn:active { transform: translateY(1px); }
.portrait {
  height: 132px; border-radius: 10px; display: grid; place-items: center; border: 1px solid #1c3039;
  background: radial-gradient(circle at 50% 55%, rgba(255, 255, 255, .07), transparent 62%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 16px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 16px);
}
.portrait svg { filter: drop-shadow(0 0 14px currentColor); }
.portrait.dim svg { opacity: .35; filter: none; }

/* Map */
#board { flex: 1; min-width: 0; position: relative; background: radial-gradient(ellipse at 50% 40%, #16203a 0%, var(--bg) 70%); }
#board svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; color: var(--muted); font-size: 12px; pointer-events: none; display: flex; flex-direction: column; gap: 2px; }
.hublink { stroke: var(--brass); stroke-opacity: .28; stroke-width: 2.5; }
.tlink { stroke-width: 1; stroke-opacity: .22; }
.tolink { stroke-width: 1; stroke-opacity: .16; stroke-dasharray: 4 4; }
.node { cursor: pointer; }
.node text { font-family: var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.hub text { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .03em; }
.tech text { font-size: 11px; fill: var(--muted); }
.zoomed-out .tech text { display: none; }
.zoomed-out .tech.hl text, .zoomed-out .tech.sel text { display: block; }
#board { background: radial-gradient(ellipse at 50% 30%, #1a2650 0%, #0b1020 62%, #060912 100%); }
.star { fill: #d6deff; }
.chan { stroke: #070b16; stroke-width: 8; stroke-linecap: round; }
.hublink { stroke: #34436b; stroke-opacity: 1; stroke-width: 3; stroke-linecap: round; }
.hublink.lit { stroke: var(--brass); filter: drop-shadow(0 0 5px var(--brass)); }
.tlink { stroke-opacity: .28; stroke-width: 1.6; stroke-linecap: round; }
.tlink.lit { stroke-opacity: .95; filter: drop-shadow(0 0 3px currentColor); }
.tolink.lit { stroke-opacity: .6; }
.hub { color: var(--brass); }
.aura { fill: none; stroke: var(--brass); stroke-opacity: .14; stroke-dasharray: 2 6; }
.socket { fill: #0a1020; stroke: currentColor; stroke-width: 1.5; stroke-opacity: .35; }
.hub .socket { stroke-width: 2; }
.reach .socket { stroke-opacity: .95; }
.learned .socket { stroke-opacity: 1; }
.orb { opacity: 0; transition: opacity .4s; }
.reach .orb { opacity: .25; }
.learned .orb { opacity: 1; filter: drop-shadow(0 0 7px currentColor); }
.glyph { fill: #0a1020; opacity: 0; }
.learned .glyph { opacity: .8; }
.hub.learned .aura { stroke-opacity: .45; }
.tech.learned text { fill: var(--ink); }
.hub.locked { opacity: .6; }
.tech.locked { opacity: .55; }
.cursor { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0; transform-box: fill-box; transform-origin: center; }
.sel .cursor { opacity: 1; animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sel .cursor { animation: none; } .orb { transition: none; } }
.focus .hublink, .focus .tlink, .focus .tolink { stroke-opacity: .05; }
.focus .node { opacity: .25; }
.focus .node.hl, .focus .node.sel { opacity: 1; }
.focus .tlink.hl { stroke-opacity: .9; stroke-width: 1.5; }
.focus .tolink.hl { stroke-opacity: .7; }
.focus .hublink.hl { stroke-opacity: .7; }
.t-sub { color: var(--sub); } .t-sweep { color: var(--sweep); } .t-pass { color: var(--pass); } .t-move { color: var(--move); } .t-escape { color: var(--escape); }

/* Panel */
aside {
  width: 360px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
aside h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; text-wrap: balance; }
.kind { font: 600 11px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; }
aside p { margin: 0; line-height: 1.5; }
aside h3 { margin: 4px 0 0; font: 600 11px var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stagebox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-2); }
.stagehead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.stagehead b { font: 700 16px var(--font-display); letter-spacing: .04em; color: var(--brass); }
.stagebox .next { color: var(--muted); font-size: 13px; }
.qlog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.qlog button { padding: 8px 4px; border-radius: 8px; border: 1px solid var(--brass); background: transparent; color: var(--brass); font: 600 12.5px var(--font-body); cursor: pointer; }
.qlog button:hover { background: var(--brass-soft); }
.today { font-size: 12.5px; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.linkbtn { all: unset; cursor: pointer; color: var(--muted); text-decoration: underline; font-size: 12.5px; }
.linkbtn:focus-visible { outline: 2px solid var(--brass); }
.basesel { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.basesel select { width: auto; flex: 1; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links button { border: 1px solid var(--line); background: var(--bg-2); color: var(--ink); border-radius: 6px; padding: 4px 9px; font: 13px var(--font-body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.links button.is-hit { border-color: var(--brass); }
.links button:hover { background: var(--line); }
.score { display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 92px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.srow .sbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.srow .sbar i { display: block; height: 100%; background: var(--brass); }
.srow.gap { color: var(--gap); }
.srow.gap .sbar { background: rgba(242, 118, 109, .25); }
.srow span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); line-height: 1.55; }
.sessions { display: flex; flex-direction: column; gap: 6px; }
.sess { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 13px; }
.sess span { color: var(--muted); }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.legend svg { width: 18px; height: 18px; }

/* Log sheet */
.overlay { position: fixed; inset: 0; background: rgba(5, 8, 15, .6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.sheet { width: min(560px, 100%); max-height: 100%; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.sheet header { border: 0; background: transparent; padding: 16px 18px 8px; justify-content: space-between; }
.sheet h2 { margin: 0; font: 700 18px var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--brass); }
.sheet .body { padding: 4px 18px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
.results { display: flex; flex-direction: column; gap: 2px; }
.results button { all: unset; cursor: pointer; padding: 6px 8px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }
.results button:hover, .results button:focus-visible { background: var(--line); }
.picked { display: flex; flex-direction: column; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.prow.need { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.primary:disabled { opacity: .4; cursor: default; }
#logCount.warn { color: var(--brass); font-weight: 700; }
.build { display: block; opacity: .45; font-size: 10px; letter-spacing: .06em; margin-top: 2px; }
.prow .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; min-width: 0; }
.prow .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; }
.prow .from { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.fromlbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fromlbl.need { color: var(--brass); }
.posrow { display: flex; flex-wrap: wrap; gap: 6px; }
.posrow button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 7px; padding: 5px 9px; font: 500 12.5px var(--font-body); cursor: pointer; }
.posrow button[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--bg); }
.another { font-size: 12.5px; }
.ask { margin-top: 8px; padding: 10px; border: 1px solid var(--brass); border-radius: 10px; background: var(--brass-soft); display: grid; gap: 8px; }
.ask b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.qlog button[aria-expanded="true"] { background: var(--brass-soft); }
.bypos { display: grid; flex-shrink: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.posline { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 13.5px var(--font-body); cursor: pointer; }
.posline:last-child { border-bottom: 0; }
.posline .st { color: var(--muted); font-size: 12.5px; }
.posline.hit .st { color: var(--brass); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font: 600 12px var(--font-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--bg); }
.x { all: unset; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.x:focus-visible { outline: 2px solid var(--brass); }

@media (max-width: 760px) {

// Session items are keyed "moveId@positionId" (where the move started from).
// Keys with no "@" come from before positions were logged and credit every position.
const keyOf = (id, pos) => pos ? `${id}@${pos}` : id;

// Best kind logged for a move in one session: from `pos` only (plus entries with no position), or from anywhere.
function bestKind(s, id, pos) {
  let best = null;
  for (const [key, it] of Object.entries(s.items)) {
    const k = splitKey(key);
    if (k.id !== id || (pos && k.pos && k.pos !== pos)) continue;
    if (!best || KRANK[it.k] > KRANK[best]) best = it.k;

}
// Counts training days (sessions) by the best thing logged for the move that day.
function stats(id, pos) {

    const k = bestKind(s, id, pos); if (!k) continue;
    seenS++; if (k !== "seen") drillS++;

}

    if (ks.length) return ks[ks.length - 1].pos;

}
function derived(st) {

// Position scorecard: how much of your game exists here (counted at Hit or better).
// Moves from here count only when logged from here; ways in count from anywhere.
function scorecard(h) {
  const at = list => ({ have: list.filter(t => posStage(t.id, h.id) >= 3).length, total: list.length });
  const into = list => ({ have: list.filter(t => stage(t.id) >= 3).length, total: list.length });
  const rows = [];
  const attacks = TECHS.filter(t => t.from.includes(h.id) && ["sub", "sweep", "move"].includes(t.type));
  const passes = TECHS.filter(t => t.from.includes(h.id) && t.type === "pass");
  const escapes = TECHS.filter(t => t.from.includes(h.id) && t.type === "escape");
  const waysIn = TECHS.filter(t => t.to === h.id);
  if (attacks.length) rows.push({ label: "Attacks", ...at(attacks) });
  if (passes.length) rows.push({ label: "Passes", ...at(passes) });
  if (escapes.length) rows.push({ label: "Escapes", ...at(escapes) });

}
function hubActive(h) { return TECHS.some(t => (t.from.includes(h.id) && posStage(t.id, h.id) >= 1) || (t.to === h.id && stage(t.id) >= 1)); }

  const out = [];

    if (!hubActive(h)) return;

      if (r.have) return;
      if (r.label === "Escapes") out.push({ id: h.id, w: 3, text: `No escape from bottom of ${h.name} at Hit yet` });
      else if (r.label === "Attacks") out.push({ id: h.id, w: 2, text: `No attack from ${h.name} at Hit yet` });

// ---------- Logging ----------
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function sessionFor(d, create) {
  let s = data.sessions.find(x => x.d === d);
  if (!s && create) { s = { id: d + "-" + Math.random().toString(36).slice(2, 7), d, items: {} }; data.sessions.push(s); data.sessions.sort((a, b) => a.d < b.d ? -1 : 1); }

}
// One entry per move per position per day; logging never downgrades it (Seen < Drilled < Hit live).
function addItem(s, id, k, pos) {

}
function quickLog(id, k, pos) {

  addItem(sessionFor(todayISO(), true), id, k, pos);
  commit();

}
function clearToday(id) {
  const s = sessionFor(todayISO(), false); if (!s) return;
  Object.keys(s.items).forEach(k => { if (splitKey(k).id === id) delete s.items[k]; });

}

function reachable(n) {

}

function fit() {

}
const panel = document.getElementById("panel");
// With `at`, a move's pips show its stage from that position only.
function chip(id, at) {

  return `<button data-go="${n.id}" class="${s >= 3 ? "is-hit" : ""}">${icon(n, 12)}${esc(n.name)}${n.hub ? "" : ` ${pips(s)}`}</button>`;
}
let asking = null; // quick log waiting for "from where?"
function legend() {
  return `<div class="legend">${Object.entries(TYPES).map(([k, v]) => `${icon({ type: k }, 18)}<span>${v.label}</span>`).join("")}${icon({ hub: true }, 18)}<span>Position</span></div>`;
}
function renderPanel() {
  const n = selected && nodeById.get(selected);
  if (!n) {
    const recent = data.sessions.slice(-6).reverse();
    panel.innerHTML = `<div class="kind">Grappling Dex</div><h2>Log what you train, watch the dex fill in</h2>
      <p class="empty">Each move climbs four stages: <b>Seen</b> when you watch it, <b>Drilled</b> when you drill it, <b>Hit</b> when you land it live, and <b>Mastered</b> when you've hit it live on ${RULES.masterDays} different days.</p>
      <p class="empty">Already know a move? Open its entry and set a starting stage. Positions score how many of their moves you can hit, and flag gaps like a missing escape.</p>
      <div class="summary">${[1, 2, 3, 4].map(k => `<div class="tile"><b>${TECHS.filter(t => stage(t.id) >= k).length}</b><span>${pips(k)} ${STAGES[k]}${k < 4 ? "+" : ""}</span></div>`).join("")}</div>
      <button class="primary" id="panelLog">Log a session</button>
      ${(() => { const g = gaps(); return g.length ? `<div class="gaps"><strong>Gaps in your game</strong>${g.map(x => `<button data-id="${x.id}">${esc(x.text)}</button>`).join("")}</div>` : ""; })()}
      <h3>Recent sessions</h3>
      ${recent.length ? `<div class="sessions">${recent.map(s => `<div class="sess"><div><b>${fmtDate(s.d)}</b> <span>· ${movesIn(s).length} move${movesIn(s).length === 1 ? "" : "s"}</span></div><button class="linkbtn" data-del="${s.id}">Remove</button></div>`).join("")}</div>` : `<p class="empty">No sessions yet. Your first log will show up here.</p>`}
      <h3>Key</h3>${legend()}`;
    panel.querySelector("#panelLog").onclick = () => openLog();
    panel.querySelectorAll(".gaps [data-id]").forEach(b => b.onclick = () => select(b.dataset.id));
    panel.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      if (b.dataset.armed) { data.sessions = data.sessions.filter(s => s.id !== b.dataset.del); commit(); toast("Session removed"); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to remove"; }
    });
    return;
  }
  if (n.hub) {
    const rows = scorecard(n), active = hubActive(n);
    const groups = Object.keys(TYPES).map(k => {
      const ts = TECHS.filter(t => t.type === k && t.from.includes(n.id));
      return ts.length ? `<h3>${TYPES[k].plural} from here (${ts.length})</h3><div class="links">${ts.map(t => chip(t.id, n.id)).join("")}</div>` : "";
    }).join("");
    const arrive = TECHS.filter(t => t.to === n.id);
    const nb = HUB_LINKS.filter(l => l.includes(n.id)).map(l => l[0] === n.id ? l[1] : l[0]);
    panel.innerHTML = `<div class="kind"><span class="entry-no">${entryNo.get(n.id)}</span><span>Position · ${TIERS[n.tier]}</span></div><h2>${esc(n.name)}</h2>
      <div class="stagebox"><div class="stagehead"><b>Scorecard</b><span class="status">moves at Hit or better</span></div>
      <div class="score">${rows.map(r => `<div class="srow ${active && !r.have && r.label !== "Ways in" ? "gap" : ""}"><span>${r.label}</span><span class="sbar"><i style="width:${r.total ? 100 * r.have / r.total : 0}%"></i></span><span>${r.have}/${r.total}</span></div>`).join("")}</div>
      ${active ? "" : `<p class="next">Log any move from here to start tracking this position.</p>`}</div>
      ${groups}
      ${arrive.length ? `<h3>Ways to get here (${arrive.length})</h3><div class="links">${arrive.map(t => chip(t.id)).join("")}</div>` : ""}
      ${nb.length ? `<h3>Connected positions</h3><div class="links">${nb.map(chip).join("")}</div>` : ""}`;
  } else {
    const s = stage(n.id), st = stats(n.id), rel = relatedMoves(n), cmb = combos(n);
    const today = sessionFor(todayISO(), false);
    const ti = today ? Object.entries(today.items).map(([k, it]) => ({ ...splitKey(k), k: it.k })).filter(x => x.id === n.id) : [];
    const lp = lastPos(n.id), order = lp && n.from.includes(lp) ? [lp, ...n.from.filter(f => f !== lp)] : n.from;
    panel.innerHTML = `<div class="kind"><span class="entry-no">${entryNo.get(n.id)}</span><span class="tag t-${n.type}">${TYPES[n.type].label}</span>${n.gi ? "<span>Gi only</span>" : ""}</div>
      <div class="portrait t-${n.type}${s ? "" : " dim"}"><svg width="96" height="96" viewBox="-30 -30 60 60" aria-hidden="true"><circle r="27" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 5"/><path d="${d3.symbol(TYPES[n.type].sym, 900)()}" fill="currentColor"/></svg></div>
      <h2>${esc(n.name)}</h2><p>${esc(n.note)}</p>
      <div class="stagebox">
        <div class="stagehead"><b>${STAGES[s]}</b>${pips(s)}</div>
        <p class="next">${nextStep(n.id)}</p>
        <div class="qlog">${Object.entries(KINDS).map(([k, l]) => `<button data-k="${k}" aria-expanded="${asking === k}">+ ${l}</button>`).join("")}</div>
        ${asking ? `<div class="ask"><b>${KINDS[asking]} from where?</b><div class="links">${order.map(h => `<button data-pos="${h}">${esc(hubById.get(h).name)}</button>`).join("")}</div></div>` : ""}
        ${ti.length ? `<div class="today"><span>Today: ${ti.map(x => `${KINDS[x.k]}${x.pos ? ` from ${esc(hubById.get(x.pos)?.name || x.pos)}` : ""}`).join(" · ")}</span><button class="linkbtn" id="clearToday">Undo today</button></div>` : ""}
        <p class="next days" aria-label="Hit live on ${Math.min(st.hitS, RULES.masterDays)} of ${RULES.masterDays} days"><span class="dots" aria-hidden="true">${Array.from({ length: RULES.masterDays }, (_, i) => `<i class="${i < st.hitS ? "f" : ""}"></i>`).join("")}</span> Hit live on ${Math.min(st.hitS, RULES.masterDays)} of ${RULES.masterDays} days</p>
        <p class="next">${st.seenS ? `Logged in ${st.seenS} session${st.seenS > 1 ? "s" : ""} · last ${fmtDate(st.last)}` : "Not logged yet."}</p>
        <label class="basesel" for="base">Already know it?<select id="base">${STAGES.map((l, i) => `<option value="${i}"${(data.base[n.id] || 0) === i ? " selected" : ""}>${i ? "Start at " + l : "No starting stage"}</option>`).join("")}</select></label>
      </div>
      <h3>Stats</h3>
      <div class="score">${[
        ["Positions", n.from.length, MAXFROM],
        ["Combos", cmb.length, MAXCMB],
        ["Days hit live", st.hitS, RULES.masterDays]
      ].map(([l, v, m]) => `<div class="srow"><span>${l}</span><span class="sbar"><i style="width:${Math.min(100, 100 * v / m)}%"></i></span><span>${v}</span></div>`).join("")}</div>
      <h3>By position · works from (${n.from.length})</h3><div class="bypos">${n.from.map(h => {
        const ps = stats(n.id, h), ds = derived(ps);
        const txt = ps.hitS ? `Hit live on ${ps.hitS} day${ps.hitS > 1 ? "s" : ""}` : ds === 2 ? "Drilled" : ds === 1 ? "Seen" : "Not logged";
        return `<button class="posline${ds >= 3 ? " hit" : ""}" data-go="${h}"><span>${esc(hubById.get(h).name)}</span><span class="st">${txt}</span>${pips(ds)}</button>`;
      }).join("")}</div>
      ${n.to ? `<h3>Leads to</h3><div class="links">${chip(n.to)}</div>` : ""}
      ${cmb.length ? `<h3>Combos with</h3><div class="links">${cmb.map(chip).join("")}</div>` : ""}
      ${rel.length ? `<h3>Related moves</h3><div class="links">${rel.map(chip).join("")}</div>` : ""}`;
    // Quick log asks where it started from, unless the move has only one position.
    panel.querySelectorAll(".qlog [data-k]").forEach(b => b.onclick = () => {
      if (n.from.length === 1) return quickLog(n.id, b.dataset.k, n.from[0]);
      asking = asking === b.dataset.k ? null : b.dataset.k; renderPanel();
    });
    panel.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => quickLog(n.id, asking, b.dataset.pos));
    const ct = panel.querySelector("#clearToday"); if (ct) ct.onclick = () => clearToday(n.id);
    panel.querySelector("#base").onchange = e => { const v = +e.target.value; if (v) data.base[n.id] = v; else delete data.base[n.id]; commit(); };
  }
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { select(b.dataset.go); if (view === "map" && !isPhone) focusOn(nodeById.get(b.dataset.go)); });
  panel.insertAdjacentHTML("afterbegin", `<div class="backbar"><button id="backBtn">‹ Back</button><span class="entry-no">${entryNo.get(n.id)}</span></div>`);
  panel.querySelector("#backBtn").onclick = () => select(null);
}
function select(id) {
  if (id !== selected) asking = null;
  selected = id;
  const n = id && nodeById.get(id);
  if (n && view === "dex") listTab = n.hub ? "positions" : "moves";
  if (n && !n.hub && hidden.has(n.type)) { hidden.delete(n.type); filters.querySelector(`[data-type="${n.type}"]`)?.setAttribute("aria-pressed", "true"); }
  refresh();
  if (id && view === "dex") document.getElementById("row-" + id)?.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  panel.scrollTop = 0;
  const vs = document.getElementById("viewerSlot"); if (vs) vs.scrollTop = 0;
}
document.addEventListener("keydown", e => {
  if (view !== "dex" || !sheet.hidden || e.altKey || e.metaKey || e.ctrlKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); nav(e.key === "ArrowDown" ? 1 : -1);
    document.getElementById("row-" + selected)?.focus({ preventScroll: true });
  }
});
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

// ---------- Filters & search ----------
const filters = document.getElementById("filters");
filters.innerHTML = Object.entries(TYPES).map(([k, v]) => `<button class="chip" data-type="${k}" aria-pressed="true"><span class="dot t-${k}"></span>${v.plural}</button>`).join("");
filters.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  const t = b.dataset.type; hidden.has(t) ? hidden.delete(t) : hidden.add(t);
  b.setAttribute("aria-pressed", String(!hidden.has(t))); refresh();

document.getElementById("names").innerHTML = ALL.map(n => `<option value="${esc(n.name)}">`).join("");
document.getElementById("find").addEventListener("change", e => {
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const n = ALL.find(n => n.name.toLowerCase() === q) || ALL.find(n => n.name.toLowerCase().includes(q));
  if (n) { if (!n.hub) { hidden.delete(n.type); filters.querySelector(`[data-type="${n.type}"]`)?.setAttribute("aria-pressed", "true"); } select(n.id); if (view === "map") focusOn(n); }
});

// ---------- Session log sheet ----------
const sheet = document.getElementById("logSheet");
// Picked rows: { uid, id, k, pos }. The same move can be added again from another position.
// `flagged` is set when Save was tapped with a position missing, to highlight those moves.
let draft = [], lastFocus = null, uidSeq = 1, flagged = false;
function newRow(id, k = "drilled") {
  const from = nodeById.get(id).from, lp = lastPos(id);
  return { uid: uidSeq++, id, k, pos: from.length === 1 ? from[0] : lp && from.includes(lp) ? lp : null };
}
function openLog() {
  lastFocus = document.activeElement;
  draft = []; flagged = false;
  if (selected && !nodeById.get(selected).hub) draft.push(newRow(selected));
  document.getElementById("logDate").value = todayISO();
  document.getElementById("logSearch").value = "";
  sheet.hidden = false; renderSheet();
  document.getElementById("logSearch").focus();
}
function closeLog() { sheet.hidden = true; lastFocus?.focus?.(); }
function renderSheet() {
  const q = document.getElementById("logSearch").value.trim().toLowerCase();
  const inDraft = new Set(draft.map(r => r.id));
  const res = q ? TECHS.filter(t => !inDraft.has(t.id) && t.name.toLowerCase().includes(q)).slice(0, 7) : [];
  document.getElementById("logResults").innerHTML = res.map(t => `<button data-add="${t.id}">${icon(t)}${esc(t.name)} <span class="status">${TYPES[t.type].label}</span></button>`).join("");
  const recentIds = [...new Set(data.sessions.slice(-4).reverse().flatMap(movesIn))].filter(id => !inDraft.has(id)).slice(0, 10);
  document.getElementById("logRecent").innerHTML = !q && recentIds.length
    ? `<div class="field">Recent<div class="links">${recentIds.map(id => `<button data-add="${id}">${icon(nodeById.get(id), 12)}${esc(nodeById.get(id).name)}</button>`).join("")}</div></div>` : "";
  const row = uid => draft.find(r => r.uid === +uid);
  document.getElementById("logPicked").innerHTML = draft.map(r => {
    const n = nodeById.get(r.id), used = new Set(draft.filter(x => x.id === r.id && x.uid !== r.uid).map(x => x.pos));
    const free = n.from.filter(h => !used.has(h));
    return `<div class="prow${flagged && !r.pos ? " need" : ""}" data-uid="${r.uid}">
      <span class="nm">${icon(n)}${esc(n.name)}</span><button class="x" data-rm="${r.uid}" aria-label="Remove ${esc(n.name)}">✕</button>
      <div class="ctrl"><span class="seg" role="group" aria-label="What you did">${Object.entries(KINDS).map(([k, l]) => `<button data-set="${r.uid}" data-k="${k}" aria-pressed="${r.k === k}">${l}</button>`).join("")}</span></div>
      <div class="from"><span class="fromlbl${r.pos ? "" : " need"}">${r.pos ? "From" : "From where?"}</span><span class="posrow" role="group" aria-label="Where ${esc(n.name)} started from">${free.map(h => `<button data-row="${r.uid}" data-pos="${h}" aria-pressed="${r.pos === h}">${esc(hubById.get(h).name)}</button>`).join("")}</span>
      ${free.length > 1 ? `<button class="linkbtn another" data-another="${r.uid}">+ Also from another position</button>` : ""}</div></div>`;
  }).join("");
  const missing = draft.filter(r => !r.pos);
  if (!missing.length) flagged = false;
  const countEl = document.getElementById("logCount");
  countEl.textContent = !draft.length ? "Nothing added yet"
    : missing.length ? `Pick where ${missing.length === 1 ? nodeById.get(missing[0].id).name : missing.length + " moves"} started`
    : `${draft.length} ${draft.length > 1 ? "entries" : "entry"} in this session`;
  countEl.classList.toggle("warn", flagged && missing.length > 0);
  // Save stays tappable once something is added: tapping it with a position missing points at that move.
  document.getElementById("saveLog").disabled = !draft.length;
  sheet.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { draft.push(newRow(b.dataset.add)); document.getElementById("logSearch").value = ""; renderSheet(); document.getElementById("logSearch").focus(); });
  sheet.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { draft = draft.filter(r => r.uid !== +b.dataset.rm); renderSheet(); });
  sheet.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { row(b.dataset.set).k = b.dataset.k; renderSheet(); });
  sheet.querySelectorAll("[data-row]").forEach(b => b.onclick = () => { row(b.dataset.row).pos = b.dataset.pos; renderSheet(); });
  sheet.querySelectorAll("[data-another]").forEach(b => b.onclick = () => {
    const r = row(b.dataset.another), used = new Set(draft.filter(x => x.id === r.id).map(x => x.pos));
    const free = nodeById.get(r.id).from.filter(h => !used.has(h));
    draft.push({ uid: uidSeq++, id: r.id, k: r.k, pos: free.length === 1 ? free[0] : null }); renderSheet();
  });
}
document.getElementById("logSearch").addEventListener("input", renderSheet);
document.getElementById("logSearch").addEventListener("keydown", e => { if (e.key === "Enter") { const b = sheet.querySelector("#logResults [data-add]"); if (b) { e.preventDefault(); b.click(); } } });
document.getElementById("openLog").onclick = openLog;
document.getElementById("closeLog").onclick = closeLog;
document.getElementById("cancelLog").onclick = closeLog;
sheet.addEventListener("click", e => { if (e.target === sheet) closeLog(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeLog(); });
document.getElementById("saveLog").onclick = () => {
  try { saveSession(); } catch (e) { toast("Couldn't save: " + (e && e.message || e)); console.error(e); }
};
// Any other error is shown instead of failing silently.
window.addEventListener("error", e => toast("Something went wrong: " + (e.message || "unknown error")));
window.addEventListener("unhandledrejection", e => toast("Couldn't sync: " + ((e.reason && e.reason.message) || e.reason || "unknown error")));
function saveSession() {
  const d = document.getElementById("logDate").value || todayISO();
  const before = new Map(TECHS.map(t => [t.id, stage(t.id)]));
  if (!draft.length) return;
  const first = draft.find(r => !r.pos);
  if (first) {
    flagged = true; renderSheet();
    const rowEl = sheet.querySelector(`.prow[data-uid="${first.uid}"]`);
    rowEl?.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
    rowEl?.querySelector("[data-pos]")?.focus({ preventScroll: true });
    return;
  }
  const s = sessionFor(d, true);
  draft.forEach(r => addItem(s, r.id, r.k, r.pos));
  commit(); closeLog();
  const ids = [...new Set(draft.map(r => r.id))], ups = ids.filter(id => stage(id) > before.get(id));
  toast(ups.length ? `Saved · ${ups.length} move${ups.length > 1 ? "s" : ""} levelled up` : `Saved · ${ids.length} move${ids.length > 1 ? "s" : ""} logged`);
};

// ---------- Saving: your account when available, this browser otherwise ----------
const syncEl = document.getElementById("sync");
let ref = null, writing = false, again = false, saveTimer = null;
function save() {
  data.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  if (!ref) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (!ref) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await ref.set({ v: 2, sessions: data.sessions, base: data.base, updatedAt: data.updatedAt || Date.now() }); syncEl.textContent = "Saved to your account"; }
  catch (e) { syncEl.textContent = "Saved in this browser only"; toast("Couldn't save to your account: " + (e && e.message || e)); }
  writing = false;
  if (again) { again = false; flush(); }
}
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    ref = db.collection("data/users/" + id).doc("progress");
    let first = true;
    const wait = setTimeout(() => { syncEl.textContent = "Can't reach saved progress yet"; }, 10000);
    ref.onSnapshot(snap => {
      if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(wait);
      const d = snap.data();
      const pending = snap.metadata && snap.metadata.hasPendingWrites;
      if (d && d.v === 2 && Array.isArray(d.sessions)) {
        // The account copy arrives read-only (frozen), so work on a deep copy we can change.
        if (!pending) { const copy = JSON.parse(JSON.stringify(d)); data = { v: 2, sessions: copy.sessions, base: copy.base || {}, updatedAt: copy.updatedAt }; recompute(); refresh(); }
      } else if (first) {
        if (d && Array.isArray(d.learned)) d.learned.forEach(x => { const n = nodeById.get(x); if (n && !n.hub && !data.base[x]) data.base[x] = 2; });
        if (data.sessions.length || Object.keys(data.base).length) { recompute(); refresh(); flush(); }
      }
      first = false;
    }, () => { clearTimeout(wait); ref = null; });
  } catch (e) { ref = null; }
})();

// ---------- Views ----------
let fitted = false;
function setView(v) {
  if (v === "progress" && !isPhone) v = "dex";
  if (isPhone && v !== view) selected = null;
  view = v;
  dexEl.hidden = v !== "dex";
  document.getElementById("board").hidden = v !== "map";
  document.body.classList.toggle("v-dex", v === "dex");
  document.body.classList.toggle("v-map", v === "map");
  document.body.classList.toggle("v-progress", v === "progress");
  document.getElementById("tab-dex").setAttribute("aria-current", v === "dex" ? "page" : "false");
  document.getElementById("tab-map").setAttribute("aria-current", v === "map" ? "page" : "false");
  document.querySelectorAll(".tabbar [data-v]").forEach(b => b.setAttribute("aria-current", b.dataset.v === v ? "page" : "false"));
  // Phones: the entry panel is a full-screen sheet; desktop dex: it's the device's left screen.
  if (v === "dex" && !isPhone) document.getElementById("viewerSlot").appendChild(panel);
  else document.querySelector("main").appendChild(panel);
  // Phones: the type filters live at the top of the list instead of the header.
  const f = document.getElementById("filters");
  if (isPhone) dexEl.querySelector(".listhead").appendChild(f);
  else document.querySelector("header .search").before(f);
  if (v === "map" && !fitted) { fit(); fitted = true; }
  refresh();
  if (v === "map" && selected && !isPhone) focusOn(nodeById.get(selected));
}
const viewFromHash = () => ({ "#map": "map", "#progress": "progress" })[location.hash] || "dex";
window.addEventListener("hashchange", () => setView(viewFromHash()));
document.querySelectorAll(".tabbar [data-v]").forEach(b => b.onclick = () => {
  if (b.dataset.v === view) { select(null); return; }
  location.hash = b.dataset.v;
});
document.querySelector(".tabbar [data-log]").onclick = () => openLog();
phoneQuery.addEventListener("change", e => { isPhone = e.matches; fitted = false; setView(view); });
recompute();
setView(viewFromHash());
</script>
